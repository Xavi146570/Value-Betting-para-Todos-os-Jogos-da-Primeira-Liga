services:
  - type: web
    name: primeira-liga-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_FOOTBALL_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DATABASE_URL
        value: sqlite:///opt/render/project/src/data/primeira_liga.db
      - key: LEAGUE_ID
        value: "94"
      - key: SEASON
        value: "2024"
      - key: MIN_EDGE
        value: "0.03"
      - key: BANKROLL
        value: "10000"
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
